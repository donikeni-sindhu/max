<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>REBORN</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #3a2418;
        --cream: #fff6ea;
        --peach: #ffd7b5;
        --orange: #f4a261;
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        min-height: 100%;
      }

      body {
        font-family: "Segoe UI", sans-serif;
        color: var(--ink);
        background:
          radial-gradient(circle at 12% 18%, rgba(255, 196, 214, 0.55), transparent 28%),
          radial-gradient(circle at 88% 12%, rgba(255, 214, 140, 0.6), transparent 26%),
          radial-gradient(circle at 80% 86%, rgba(255, 176, 140, 0.45), transparent 30%),
          linear-gradient(180deg, #fffaf3 0%, #ffe8cf 48%, #ffd8bf 100%);
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        background-image:
          radial-gradient(circle at 8px 6px, rgba(196, 112, 62, 0.18) 3px, transparent 3.5px),
          radial-gradient(circle at 18px 16px, rgba(196, 112, 62, 0.12) 2px, transparent 2.6px);
        background-size: 72px 72px;
        opacity: 0.7;
      }

      .cats {
        position: fixed;
        inset: 0;
        pointer-events: none;
        overflow: hidden;
      }

      .cats img {
        position: absolute;
        width: 168px;
        height: 174px;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        filter: drop-shadow(0 10px 0 rgba(90, 46, 24, 0.08));
      }

      .cats img:nth-child(1) { top: 8%; left: 4%; }
      .cats img:nth-child(2) { top: 6%; right: 6%; width: 150px; }
      .cats img:nth-child(3) { top: 38%; left: 1%; width: 156px; }
      .cats img:nth-child(4) { top: 34%; right: 2%; }
      .cats img:nth-child(5) { bottom: 2%; left: 8%; }
      .cats img:nth-child(6) { bottom: 0; right: 7%; width: 180px; }
      .cats img:nth-child(7) { top: 18%; left: 18%; width: 120px; opacity: 0.9; }
      .cats img:nth-child(8) { bottom: 12%; right: 22%; width: 130px; }

      .page {
        position: relative;
        z-index: 1;
        min-height: 100vh;
        display: grid;
        grid-template-rows: auto 1fr;
        padding: 28px 20px 40px;
      }

      header {
        text-align: center;
      }

      h1 {
        margin: 0;
        font-size: clamp(48px, 8vw, 92px);
        letter-spacing: 0.12em;
        line-height: 0.95;
      }

      header p {
        margin: 10px 0 0;
        font-size: 18px;
      }

      main {
        display: grid;
        place-items: center;
      }

      .link-card {
        display: grid;
        gap: 8px;
        justify-items: center;
        max-width: min(560px, 92vw);
        padding: 28px 32px;
        border-radius: 28px;
        text-decoration: none;
        color: var(--ink);
        background: rgba(255, 250, 243, 0.88);
        border: 3px solid rgba(90, 46, 24, 0.18);
        box-shadow: 0 16px 0 rgba(244, 162, 97, 0.35);
      }

      .link-card span {
        font-size: 13px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      .link-card strong {
        font-size: clamp(18px, 2.6vw, 30px);
        text-align: center;
        white-space: nowrap;
      }

      .link-card:hover {
        transform: translateY(-3px);
      }

      @media (max-width: 720px) {
        .cats img { width: 96px; height: 100px; }
        .cats img:nth-child(3),
        .cats img:nth-child(4),
        .cats img:nth-child(7),
        .cats img:nth-child(8) { display: none; }
        .cats img:nth-child(1) { top: 22%; left: 2%; }
        .cats img:nth-child(2) { top: 20%; right: 2%; }
        header { padding-top: 12px; }
        .link-card { width: min(100%, 320px); padding: 20px 16px; }
        .link-card strong {
          white-space: normal;
          overflow-wrap: anywhere;
          font-size: 16px;
        }
      }
    </style>
  </head>
  <body>
    <div class="cats" aria-hidden="true">
      <img src="cats/idle_sit.png" alt="" />
      <img src="cats/heart.png" alt="" />
      <img src="cats/wave.png" alt="" />
      <img src="cats/box.png" alt="" />
      <img src="cats/sleep.png" alt="" />
      <img src="cats/cheer.png" alt="" />
      <img src="cats/scarf.png" alt="" />
      <img src="cats/hood.png" alt="" />
    </div>
    <div class="page">
      <header>
        <h1>REBORN</h1>
        <p>A little cat that learns with you.</p>
      </header>
      <main>
        <a class="link-card" href="https://github.com/donikeni-sindhu/max">
          <span>Open the project</span>
          <strong>github.com/donikeni-sindhu/max</strong>
        </a>
      </main>
    </div>
  </body>
</html>
